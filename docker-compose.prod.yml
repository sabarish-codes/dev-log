services:
  api:
    image: ghcr.io/sabarish-codes/dev-log/api:${TAG:?TAG is required}
    env_file: .env.prod
    restart: unless-stopped
    expose:
      - '3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    image: ghcr.io/sabarish-codes/dev-log/nginx:${TAG:?TAG is required}
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
